<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Summer Athletics</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-blue: #64B5F6;
            --bg-green: #81C784;
            --header-yellow: #FFD54F;
            --panel-gray: #EEEEEE;
            --border-dark: #222222;
            --land-green: #388E3C;
            --ocean-blue: #1976D2;
            --text-color: #222222;
        }

        * {
            box-sizing: border-box;
            user-select: none; /* Prevent text selection during gameplay */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #222; /* Dark background outside game area */
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: var(--text-color);
        }

        #game-container {
            position: relative;
            width: 800px; /* Standard retro resolution width */
            height: 600px; /* Standard retro resolution height */
            background-color: var(--bg-blue);
            border: 4px solid var(--border-dark);
            box-shadow: 0 0 0 4px #000; /* Extra border for chunky look */
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Utility classes for text/UI overlays if needed, though most will be canvas-drawn */
        .hidden {
            display: none !important;
        }

    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script>
    // --- Constants & Config ---
    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 600;

    const COLORS = {
        bgBlue: '#64B5F6',
        bgGreen: '#81C784',
        headerYellow: '#FFD54F',
        panelGray: '#EEEEEE',
        borderDark: '#222222',
        landGreen: '#388E3C',
        oceanBlue: '#1976D2',
        white: '#FFFFFF',
        black: '#000000',
        waterBlue: '#4FC3F7', // Slightly lighter for pool
        laneLine: '#FFFFFF',
        text: '#222222'
    };

    const WORLD_MAP = [
        "00000000000000000000",
        "01110000001111000000",
        "01111000011111100000",
        "00110000011111110000",
        "00111000001111100000",
        "00011000000111000000",
        "00010000000000000000",
        "00000000000000111000",
        "00000000000000011000",
        "00000000000000000000"
    ];

    const CITY_DICTIONARY = {
        paris: { primary: '#002395', secondary: '#ED2939', name: 'Paris' },
        tokyo: { primary: '#BC002D', secondary: '#FFFFFF', name: 'Tokyo' },
        rio: { primary: '#009B3A', secondary: '#FEDF00', name: 'Rio' },
        london: { primary: '#012169', secondary: '#C8102E', name: 'London' }
    };

    const HOSTS = {
        2028: { name: 'Los Angeles', primary: '#002868', secondary: '#BF0A30' }, // USA
        2032: { name: 'Brisbane', primary: '#00843D', secondary: '#FFCD00' }   // Australia
    };

    // --- Game State ---
    const GAME_STATES = {
        START: 'START',
        HUB: 'HUB',
        RACE: 'RACE',
        RESULTS: 'RESULTS',
        ROSTER: 'ROSTER',
        ATHLETE_DETAIL: 'ATHLETE_DETAIL',
        ACADEMY: 'ACADEMY',
        HOF: 'HOF'
    };

    // --- Audio Controller ---
    class AudioController {
        constructor() {
            this.sounds = {
                bgm: new Audio('bgm.mp3'),
                blip: new Audio('blip.mp3'),
                splash: new Audio('splash.mp3'),
                buzzer: new Audio('buzzer.mp3')
            };
            this.sounds.bgm.loop = true;
        }

        playBgm() {
            this.sounds.bgm.play().catch(e => console.log("Audio play failed (user interaction needed first)"));
        }

        playSfx(name) {
            if (this.sounds[name]) {
                const sfx = this.sounds[name].cloneNode();
                sfx.play().catch(e => {});
            }
        }
    }
    const audio = new AudioController();

    // --- Data Classes ---
    class Athlete {
        constructor(name, age, speed, stamina, technique) {
            this.name = name;
            this.age = age;
            this.sport = 'Swimmer'; // Default for MVP
            this.speed = speed;       // 1-100
            this.stamina = stamina;   // 1-100
            this.technique = technique; // 1-100
            this.cycles = 0; // Number of World Games participated in
            this.medals = 0;
            this.pb = null; // Personal Best time
            this.hofTag = false; // Hall of Fame tag
        }

        train(facilityLevel) {
            // Training logic: Gain based on facility level
            // Base gain 0.5 * Level
            const gain = 0.5 * facilityLevel;
            this.speed = Math.min(100, this.speed + gain);
            this.stamina = Math.min(100, this.stamina + gain);
            this.technique = Math.min(100, this.technique + gain);
        }

        ageUp() {
            this.age += 4;
            this.cycles++;

            // Degrade after 3rd cycle
            if (this.cycles > 3) {
                this.speed *= 0.9;
                this.stamina *= 0.9;
                this.technique *= 0.9;
            }
        }

        shouldRetire() {
            return this.cycles >= 5;
        }
    }

    class Nation {
        constructor(name, primaryColor, secondaryColor, baseStats) {
            this.name = name;
            this.primaryColor = primaryColor;
            this.secondaryColor = secondaryColor;
            this.money = 0;
            this.facilities = {
                aquatics: 1 // Level 1-10
            };
            this.roster = [];
            this.hallOfFame = [];
            this.baseStats = baseStats; // { speed: range, stamina: range... } for generating roster
        }

        generateRoster() {
            this.roster = [];
            // Generate 3 athletes
            for(let i=0; i<3; i++) {
                this.roster.push(this.createAthlete());
            }
        }

        createAthlete(isProspect = false) {
            const names = ["Smith", "Jones", "Ali", "Chen", "Silva", "Kim", "M Muller", "Popov", "Wang", "Rossi"];
            const name = names[Math.floor(Math.random() * names.length)];

            // Base stats from nation profile
            let spd = this.baseStats.speed;
            let sta = this.baseStats.stamina;
            let tec = this.baseStats.technique;

            if (isProspect) {
                // Prospects have higher starting stats
                spd += 10; sta += 10; tec += 10;
            } else if (!this.roster.length && !isProspect) {
                 // Initial roster generation logic uses base stats directly
            } else {
                // Walk-ons have terrible stats (1/10th of base roughly? Or just very low)
                // "1/10 stats" as per prompt
                 spd = 10; sta = 10; tec = 10;
            }

            return new Athlete(name, 18, spd, sta, tec);
        }
    }

    class Game {
        constructor() {
            this.year = 2024;
            this.month = 48; // Counts down to 0
            this.playerNation = null;
            this.currentHost = null; // Will be set dynamically
            this.state = GAME_STATES.START;
            this.selectedAthlete = null; // Reference to object
        }

        start(nationChoice) {
            // nationChoice: 'USA', 'EGY', 'AUS'
            if (nationChoice === 'USA') {
                this.playerNation = new Nation("USA", "#002868", "#BF0A30", {speed: 80, stamina: 70, technique: 70});
                this.playerNation.money = 50000;
                this.playerNation.facilities.aquatics = 5;
            } else if (nationChoice === 'EGY') {
                this.playerNation = new Nation("Egypt", "#CE1126", "#000000", {speed: 40, stamina: 40, technique: 40});
                this.playerNation.money = 10000;
            } else { // AUS
                this.playerNation = new Nation("Australia", "#00843D", "#FFCD00", {speed: 70, stamina: 60, technique: 80});
                this.playerNation.money = 25000;
                this.playerNation.facilities.aquatics = 3;
            }
            this.playerNation.generateRoster();
            this.setHost();
            this.state = GAME_STATES.HUB;
        }

        setHost() {
            const cycleYear = this.year + 4;
            if (cycleYear === 2028) this.currentHost = HOSTS[2028];
            else if (cycleYear === 2032) this.currentHost = HOSTS[2032];
            else {
                // Random from dictionary
                const keys = Object.keys(CITY_DICTIONARY);
                const key = keys[Math.floor(Math.random() * keys.length)];
                this.currentHost = CITY_DICTIONARY[key];
            }
        }
    }

    const game = new Game();
    let currentState = GAME_STATES.START;

    // Canvas Setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Basic Input Handling
    const keys = {};
    window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        // Prevent scrolling with Space/Arrow keys
        if(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.code) > -1) {
            e.preventDefault();
        }
    });
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    // Mouse Handling for UI clicks
    const mouse = { x: 0, y: 0, click: false, isDown: false };
    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = (e.clientX - rect.left) * (CANVAS_WIDTH / rect.width);
        mouse.y = (e.clientY - rect.top) * (CANVAS_HEIGHT / rect.height);
    });
    canvas.addEventListener('mousedown', () => mouse.isDown = true);
    canvas.addEventListener('mouseup', () => {
        mouse.isDown = false;
        mouse.click = true; // Register click on mouse up
    });


    // --- Helper Functions ---
    function drawRect(x, y, w, h, color, border = false) {
        ctx.fillStyle = color;
        ctx.fillRect(x, y, w, h);
        if (border) {
            ctx.strokeStyle = COLORS.black; // Prompt says "solid 4px black borders"
            ctx.lineWidth = 4;
            ctx.strokeRect(x, y, w, h);
        }
    }

    function drawText(text, x, y, size, color, align = 'left') {
        ctx.fillStyle = color;
        ctx.font = `${size}px "Press Start 2P"`;
        ctx.textAlign = align;
        ctx.fillText(text, x, y);
    }

    function isInside(pos, rect) {
        return pos.x > rect.x && pos.x < rect.x + rect.w && pos.y < rect.y + rect.h && pos.y > rect.y;
    }

    // --- State Implementations ---

    // 1. START SCREEN (Full Screen Map)
    const startPins = [
        { x: 140, y: 180, r: 15, code: 'USA', name: 'USA', color: '#002868', funds: '$50k', stats: { spd: 80, sta: 70, tec: 70 } },
        { x: 440, y: 220, r: 15, code: 'EGY', name: 'Egypt', color: '#CE1126', funds: '$10k', stats: { spd: 40, sta: 40, tec: 40 } },
        { x: 700, y: 380, r: 15, code: 'AUS', name: 'Australia', color: '#00843D', funds: '$25k', stats: { spd: 70, sta: 60, tec: 80 } }
    ];

    function updateStart() {
        if (mouse.click) {
            startPins.forEach(pin => {
                const dist = Math.sqrt((mouse.x - pin.x)**2 + (mouse.y - pin.y)**2);
                if (dist < pin.r + 15) {
                    game.start(pin.code);
                    if (game.state === GAME_STATES.HUB) {
                        currentState = GAME_STATES.HUB;
                        audio.playSfx('blip');
                    }
                }
            });
        }
    }

    function drawStart() {
        // Full Screen Map 800x600 using 40px blocks
        const blockSize = 40;
        const startY = 100; // Center the 20x10 map vertically (400px tall), padding 100 top/bottom

        // Ocean Background
        ctx.fillStyle = COLORS.oceanBlue;
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        // Render Map
        for (let r = 0; r < WORLD_MAP.length; r++) {
            for (let c = 0; c < WORLD_MAP[r].length; c++) {
                const char = WORLD_MAP[r][c];
                const x = c * blockSize;
                const y = startY + r * blockSize;
                if (char === '1') {
                    ctx.fillStyle = COLORS.landGreen;
                    ctx.fillRect(x, y, blockSize, blockSize);
                }
            }
        }

        // Overlay Title
        drawRect(100, 20, 600, 60, '#000000AA');
        drawText("WORLD SUMMER ATHLETICS", CANVAS_WIDTH/2, 60, 24, COLORS.white, 'center');
        drawText("Select Nation", CANVAS_WIDTH/2, 580, 16, COLORS.white, 'center');

        // Pins & Hover Cards
        startPins.forEach(pin => {
            const isHover = Math.sqrt((mouse.x - pin.x)**2 + (mouse.y - pin.y)**2) < pin.r + 15;

            // Pin Body
            ctx.fillStyle = isHover ? COLORS.headerYellow : pin.color;
            ctx.beginPath();
            ctx.arc(pin.x, pin.y, pin.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = COLORS.white;
            ctx.lineWidth = 3;
            ctx.stroke();

            // Hover Card
            if (isHover) {
                const cardW = 280;
                const cardH = 220;
                let cardX = pin.x + 30;
                let cardY = pin.y - 100;

                // Keep inside screen
                if (cardX + cardW > CANVAS_WIDTH) cardX = pin.x - cardW - 30;
                if (cardY < 0) cardY = 10;
                if (cardY + cardH > CANVAS_HEIGHT) cardY = CANVAS_HEIGHT - cardH - 10;

                drawRect(cardX, cardY, cardW, cardH, COLORS.panelGray, true);

                // Header
                ctx.fillStyle = pin.color;
                ctx.fillRect(cardX + 4, cardY + 4, cardW - 8, 40);
                drawText(pin.name, cardX + cardW/2, cardY + 30, 16, COLORS.white, 'center');

                // Funds
                drawText(`Funds: ${pin.funds}`, cardX + 20, cardY + 70, 12, COLORS.text);

                // Stat Bars
                const drawBar = (label, val, sy) => {
                    drawText(label, cardX + 20, sy, 10, COLORS.text);
                    // Dark Track
                    ctx.fillStyle = '#222';
                    ctx.fillRect(cardX + 110, sy - 8, 140, 12);
                    // Fill
                    ctx.fillStyle = pin.color;
                    ctx.fillRect(cardX + 110, sy - 8, val * 1.4, 12);
                };

                drawBar("SPEED", pin.stats.spd, cardY + 100);
                drawBar("STAMINA", pin.stats.sta, cardY + 130);
                drawBar("TECH", pin.stats.tec, cardY + 160);
            }
        });
    }

    // 2. THE HUB (Front Office)
    const hubUI = {
        trainBtn: { x: 550, y: 500, w: 200, h: 60 },
        rosterBtn: { x: 50, y: 400, w: 220, h: 50 },
        academyBtn: { x: 50, y: 460, w: 220, h: 50 },
        hofBtn: { x: 50, y: 520, w: 220, h: 50 }
    };

    function updateHub() {
        if (!mouse.click) return;

        // Navigation
        if (isInside(mouse, hubUI.rosterBtn)) {
            currentState = GAME_STATES.ROSTER;
            audio.playSfx('blip');
        }

        // Train / Play
        if (isInside(mouse, hubUI.trainBtn)) {
             if (game.month > 0) {
                 if (game.month >= 3) {
                     // Train random or selected? "Train improves selected athlete".
                     // But here we are in Hub, not Roster.
                     // Let's assume Train advances time and gives small global boost or just waits.
                     // The prompt says "Clicking 'Train' costs 3 months. Hitting 0 triggers World Games."
                     // And "Clicking 'Train' improves the stats for the currently selected athlete."
                     // If no athlete selected (default), maybe select first.
                     if (!game.selectedAthlete && game.playerNation.roster.length > 0) {
                         game.selectedAthlete = game.playerNation.roster[0];
                     }
                     if (game.selectedAthlete) {
                         game.month -= 3;
                         game.selectedAthlete.train(game.playerNation.facilities.aquatics);
                         audio.playSfx('blip');
                     }
                 }
             } else {
                 // GO TO GAMES
                 startRace();
                 audio.playSfx('blip');
             }
        }

        mouse.click = false;
    }

    function drawHub() {
        // Dynamic Theming
        const hostColor = game.currentHost ? game.currentHost.primary : COLORS.headerYellow;
        const hostSecColor = game.currentHost ? game.currentHost.secondary : COLORS.white;

        // Top Banner
        ctx.fillStyle = hostColor;
        ctx.fillRect(0, 0, CANVAS_WIDTH, 80);
        drawText(`ROAD TO ${game.currentHost.name.toUpperCase()} ${game.year + 4}`, CANVAS_WIDTH/2, 40, 20, COLORS.white, 'center');
        drawText(`Funds: $${game.playerNation.money}`, CANVAS_WIDTH - 20, 70, 16, COLORS.white, 'right');

        // Center Info (Calendar & Facilities)
        // Calendar
        drawRect(300, 150, 200, 120, COLORS.panelGray, true);
        drawText("CALENDAR", 400, 180, 16, COLORS.text, 'center');
        drawText(`${game.month}`, 400, 230, 40, COLORS.text, 'center');
        drawText("MONTHS LEFT", 400, 260, 12, COLORS.text, 'center');

        // Facility
        drawRect(300, 300, 200, 100, COLORS.panelGray, true);
        drawText("FACILITIES", 400, 330, 16, COLORS.text, 'center');
        drawText(`Aquatics: ${game.playerNation.facilities.aquatics}`, 400, 360, 14, COLORS.text, 'center');

        // Navigation Buttons
        const drawBtn = (btn, text, color = COLORS.panelGray) => {
            drawRect(btn.x, btn.y, btn.w, btn.h, color, true);
            drawText(text, btn.x + btn.w/2, btn.y + btn.h/2 + 5, 14, COLORS.text, 'center');
        };

        drawBtn(hubUI.rosterBtn, "ROSTER");
        drawBtn(hubUI.academyBtn, "YOUTH ACADEMY");
        drawBtn(hubUI.hofBtn, "HALL OF FAME");

        // Train Button logic
        const trainColor = game.month > 0 ? COLORS.headerYellow : '#00AA00';
        const trainText = game.month > 0 ? "TRAIN (3mo)" : "GO TO GAMES";
        drawRect(hubUI.trainBtn.x, hubUI.trainBtn.y, hubUI.trainBtn.w, hubUI.trainBtn.h, trainColor, true);
        drawText(trainText, hubUI.trainBtn.x + 100, hubUI.trainBtn.y + 35, 16, game.month > 0 ? COLORS.text : COLORS.white, 'center');

        // Selected Athlete Info snippet
        if (game.selectedAthlete) {
            drawText(`Training: ${game.selectedAthlete.name}`, 400, 550, 12, COLORS.white, 'center');
        }
    }

    // 3. ROSTER SCREEN
    const rosterUI = {
        backBtn: { x: 50, y: 530, w: 150, h: 50 },
        listStartY: 120,
        itemH: 60
    };

    function updateRoster() {
        if (!mouse.click) return;

        if (isInside(mouse, rosterUI.backBtn)) {
            currentState = GAME_STATES.HUB;
            audio.playSfx('blip');
        }

        // List clicks
        game.playerNation.roster.forEach((athlete, i) => {
            const y = rosterUI.listStartY + (i * (rosterUI.itemH + 10));
            if (mouse.y > y && mouse.y < y + rosterUI.itemH && mouse.x > 50 && mouse.x < 750) {
                game.selectedAthlete = athlete;
                currentState = GAME_STATES.ATHLETE_DETAIL;
                audio.playSfx('blip');
            }
        });

        mouse.click = false;
    }

    function drawRoster() {
        // Banner
        ctx.fillStyle = game.playerNation.primaryColor;
        ctx.fillRect(0, 0, CANVAS_WIDTH, 80);
        drawText("TEAM ROSTER", CANVAS_WIDTH/2, 50, 24, COLORS.white, 'center');

        // List
        game.playerNation.roster.forEach((athlete, i) => {
            const y = rosterUI.listStartY + (i * (rosterUI.itemH + 10));
            drawRect(50, y, 700, rosterUI.itemH, COLORS.panelGray, true);

            // Name
            drawText(athlete.name, 70, y + 35, 16, COLORS.text);
            // Sport
            drawText(athlete.sport, 300, y + 35, 14, '#555');
            // Age
            drawText(`Age: ${athlete.age}`, 500, y + 35, 14, COLORS.text);
            // Condition
            let cond = "OK";
            if (athlete.cycles > 3) cond = "OLD";
            drawText(cond, 650, y + 35, 14, cond === 'OLD' ? '#AA0000' : '#00AA00');
        });

        // Back
        drawRect(rosterUI.backBtn.x, rosterUI.backBtn.y, rosterUI.backBtn.w, rosterUI.backBtn.h, COLORS.headerYellow, true);
        drawText("BACK", rosterUI.backBtn.x + 75, rosterUI.backBtn.y + 30, 16, COLORS.text, 'center');
    }

    // 4. ATHLETE DETAIL SCREEN
    const detailUI = {
        backBtn: { x: 50, y: 530, w: 150, h: 50 },
        tagBtn: { x: 550, y: 530, w: 200, h: 50 }
    };

    function updateDetail() {
        if (!mouse.click) return;

        if (isInside(mouse, detailUI.backBtn)) {
            currentState = GAME_STATES.ROSTER;
            audio.playSfx('blip');
        }

        if (isInside(mouse, detailUI.tagBtn)) {
            game.selectedAthlete.hofTag = !game.selectedAthlete.hofTag;
            audio.playSfx('blip');
        }

        mouse.click = false;
    }

    function drawDetail() {
        const a = game.selectedAthlete;
        if (!a) return;

        // Banner
        ctx.fillStyle = game.playerNation.primaryColor;
        ctx.fillRect(0, 0, CANVAS_WIDTH, 80);
        drawText(a.name.toUpperCase(), CANVAS_WIDTH/2, 50, 24, COLORS.white, 'center');

        // Info Panel
        drawRect(50, 100, 700, 400, COLORS.panelGray, true);

        drawText(`Age: ${a.age}`, 100, 150, 20, COLORS.text);
        drawText(`Sport: ${a.sport}`, 100, 190, 20, COLORS.text);

        // Stats
        const drawBigBar = (label, val, y) => {
            drawText(label, 100, y, 16, COLORS.text);
            ctx.fillStyle = '#222'; // Dark track
            ctx.fillRect(250, y - 16, 400, 20);
            ctx.fillStyle = game.playerNation.secondaryColor;
            ctx.fillRect(250, y - 16, val * 4, 20); // 100 * 4 = 400 width
        };

        drawBigBar("SPEED", a.speed, 250);
        drawBigBar("STAMINA", a.stamina, 300);
        drawBigBar("TECHNIQUE", a.technique, 350);

        // Career
        drawText(`World Games Cycles: ${a.cycles}`, 100, 420, 16, COLORS.text);
        drawText(`Medals Won: ${a.medals}`, 100, 450, 16, COLORS.text);
        drawText(`PB: ${a.pb ? a.pb.toFixed(2) + 's' : '--'}`, 400, 450, 16, COLORS.text);

        // Buttons
        drawRect(detailUI.backBtn.x, detailUI.backBtn.y, detailUI.backBtn.w, detailUI.backBtn.h, COLORS.headerYellow, true);
        drawText("BACK", detailUI.backBtn.x + 75, detailUI.backBtn.y + 30, 16, COLORS.text, 'center');

        // HoF Tag
        const tagColor = a.hofTag ? '#00AA00' : '#777';
        const tagText = a.hofTag ? "TAGGED FOR HOF" : "TAG FOR HOF";
        drawRect(detailUI.tagBtn.x, detailUI.tagBtn.y, detailUI.tagBtn.w, detailUI.tagBtn.h, tagColor, true);
        drawText(tagText, detailUI.tagBtn.x + 100, detailUI.tagBtn.y + 30, 14, COLORS.white, 'center');
    }

    // 5. RACE LOGIC (100m Freestyle)
    const RACE_PHASES = {
        BLOCKS: 0,
        DIVE: 1,
        UNDERWATER: 2,
        SWIMMING: 3,
        TURN: 4,
        FINISH: 5,
        DQ: 6
    };

    const race = {
        phase: RACE_PHASES.BLOCKS,
        distance: 0,
        speed: 0,
        stamina: 100,
        maxStamina: 100,
        timer: 0,
        lastInputTime: 0,
        lane: 4,
        feedback: { text: '', time: 0 },
        athlete: null,
        statSpeed: 0,
        statStamina: 0,
        statTech: 0,
        keys: { a: false, d: false, w: false, space: false },
        lastFrameKeys: { a: false, d: false, w: false, space: false }
    };

    function startRace() {
        currentState = GAME_STATES.RACE;
        const athlete = game.selectedAthlete; // Use selected
        if (!athlete) return; // Should not happen

        race.athlete = athlete;
        race.statSpeed = athlete.speed;
        race.statStamina = athlete.stamina;
        race.statTech = athlete.technique;

        race.phase = RACE_PHASES.BLOCKS;
        race.distance = 0;
        race.speed = 0;
        race.maxStamina = athlete.stamina;
        race.stamina = race.maxStamina;
        race.timer = -3000;
        race.lastInputTime = 0;
        race.feedback = { text: "READY", time: 100 };
    }

    function updateRace() {
        race.timer += 16.6;

        const pressedSpace = keys.Space && !race.lastFrameKeys.space;
        const pressedW = keys.KeyW && !race.lastFrameKeys.w;
        const pressedA = keys.KeyA && !race.lastFrameKeys.a;
        const pressedD = keys.KeyD && !race.lastFrameKeys.d;

        race.lastFrameKeys.space = keys.Space;
        race.lastFrameKeys.w = keys.KeyW;
        race.lastFrameKeys.a = keys.KeyA;
        race.lastFrameKeys.d = keys.KeyD;

        if (race.phase === RACE_PHASES.BLOCKS) {
            if (race.timer >= 0) {
                race.phase = RACE_PHASES.DIVE;
                race.feedback = { text: "GO!", time: 60 };
                race.timer = 0;
            } else {
                if (race.timer > -1000) race.feedback.text = "SET";
                else if (race.timer > -2000) race.feedback.text = "TAKE YOUR MARKS";
            }
        }
        else if (race.phase === RACE_PHASES.DIVE) {
             if (pressedSpace) {
                 if (race.timer < 500) {
                      race.speed = 5 + (race.statSpeed / 20);
                      race.phase = RACE_PHASES.UNDERWATER;
                      race.feedback = { text: "GREAT DIVE!", time: 60 };
                      audio.playSfx('splash');
                 } else {
                      race.speed = 3;
                      race.phase = RACE_PHASES.UNDERWATER;
                      race.feedback = { text: "SLOW...", time: 60 };
                      audio.playSfx('splash');
                 }
             }
             if (race.timer > 1500) {
                 race.speed = 2;
                 race.phase = RACE_PHASES.UNDERWATER;
                 race.feedback = { text: "LATE!", time: 60 };
                 audio.playSfx('splash');
             }
        }
        else if (race.phase === RACE_PHASES.UNDERWATER) {
            race.speed *= 0.98;
            if (pressedSpace) {
                race.speed += 0.5 + (race.statSpeed / 200);
                race.stamina -= 2;
                audio.playSfx('splash');
            }
            if (pressedW) {
                race.phase = RACE_PHASES.SWIMMING;
                race.feedback = { text: "SURFACED", time: 30 };
            }
            // 15m Rule (Start and Turn return)
            if ((race.distance > 15 && race.distance < 50) || (race.distance > 65 && race.distance < 100)) {
                 race.phase = RACE_PHASES.DQ;
                 race.feedback = { text: "DQ! UNDERWATER > 15m", time: 200 };
                 audio.playSfx('buzzer');
            }
        }
        else if (race.phase === RACE_PHASES.SWIMMING) {
            race.speed *= 0.97;
            if (pressedA || pressedD) {
                const now = Date.now();
                const diff = now - race.lastInputTime;
                race.lastInputTime = now;
                if (diff < 300) {
                    race.stamina -= 3;
                    race.feedback = { text: "BAD! TOO FAST", time: 30 };
                } else if (diff > 800) {
                     race.speed += 0.2;
                     race.feedback = { text: "TOO SLOW", time: 30 };
                } else {
                     const quality = Math.abs(500 - diff);
                     if (quality < 50) {
                         race.speed += 0.8 + (race.statSpeed / 300);
                         race.stamina -= 0.5;
                         race.feedback = { text: "PERFECT!", time: 30 };
                     } else {
                         race.speed += 0.5;
                         race.stamina -= 1;
                         race.feedback = { text: "GOOD", time: 30 };
                     }
                }
                audio.playSfx('splash');
            }
            if (race.distance >= 50 && race.distance < 51) {
                 race.phase = RACE_PHASES.TURN;
                 race.feedback = { text: "TURN! PRESS SPACE", time: 100 };
                 race.speed = 0;
            }
        }
        else if (race.phase === RACE_PHASES.TURN) {
            if (pressedSpace) {
                race.phase = RACE_PHASES.UNDERWATER;
                race.distance = 50.1;
                race.speed = 4 + (race.statTech / 25);
                race.feedback = { text: "GREAT TURN!", time: 60 };
                audio.playSfx('splash');
            }
        }

        if (race.stamina <= 0) {
            race.stamina = 0;
            const max = (4.0 * 0.2);
            if (race.speed > max) race.speed = max;
        }

        if (race.phase !== RACE_PHASES.BLOCKS && race.phase !== RACE_PHASES.TURN && race.phase !== RACE_PHASES.FINISH && race.phase !== RACE_PHASES.DQ) {
            race.distance += race.speed * 0.016;
        }

        if (race.distance >= 100 && race.phase !== RACE_PHASES.FINISH) {
            race.phase = RACE_PHASES.FINISH;
            race.feedback = { text: "FINISHED!", time: 200 };

            const time = race.timer / 1000;
            let prize = 0;
            let rank = "4th";
            if (time < 26) { prize = 50000; rank = "1st"; }
            else if (time < 28) { prize = 25000; rank = "2nd"; }
            else if (time < 30) { prize = 10000; rank = "3rd"; }

            // Update PB
            if (!race.athlete.pb || time < race.athlete.pb) {
                race.athlete.pb = time;
            }
            // Add Medals if 1st, 2nd, 3rd
            if (rank !== "4th") {
                race.athlete.medals++;
            }

            game.playerNation.money += prize;
            game.lastRaceResult = { time: time, rank: rank, prize: prize };

            setTimeout(() => {
                currentState = GAME_STATES.RESULTS;
            }, 2000);
        }

        if (race.feedback.time > 0) race.feedback.time--;
    }

    function drawRace() {
        ctx.fillStyle = COLORS.waterBlue;
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        const laneHeight = 60;
        const startY = 100;
        const poolStart = 50;
        const poolEnd = 750;

        ctx.strokeStyle = COLORS.laneLine;
        ctx.lineWidth = 2;
        for (let i = 0; i <= 8; i++) {
            const y = startY + (i * laneHeight);
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(CANVAS_WIDTH, y);
            ctx.stroke();
            if (i < 8) drawText(`${i+1}`, 20, y + 40, 20, '#FFFFFF55', 'center');
        }

        // 15m Lines
        const line15mX = poolStart + (15 * 14);
        ctx.strokeStyle = '#FF0000';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(line15mX, startY);
        ctx.lineTo(line15mX, startY + (8 * laneHeight));
        ctx.stroke();
        drawText("15m", line15mX, startY - 10, 10, '#FF0000', 'center');

        const line15mReturnX = poolEnd - (15 * 14);
        ctx.beginPath();
        ctx.moveTo(line15mReturnX, startY);
        ctx.lineTo(line15mReturnX, startY + (8 * laneHeight));
        ctx.stroke();
        drawText("15m", line15mReturnX, startY - 10, 10, '#FF0000', 'center');

        // Walls
        ctx.fillStyle = '#999';
        ctx.fillRect(0, startY - 20, 50, (8 * laneHeight) + 40);
        ctx.fillRect(750, startY - 20, 50, (8 * laneHeight) + 40);

        // Swimmer
        let swimmerX = 0;
        let facingRight = true;

        if (race.distance <= 50) {
            swimmerX = poolStart + (race.distance * 14);
            facingRight = true;
        } else {
            swimmerX = poolEnd - ((race.distance - 50) * 14);
            facingRight = false;
        }

        const swimmerY = startY + (race.lane * laneHeight) - (laneHeight/2);

        ctx.save();
        ctx.translate(swimmerX, swimmerY);
        if (!facingRight) ctx.scale(-1, 1);

        const armAngle = Math.sin(race.timer * 0.01) * 1;
        const capColor = game.playerNation.primaryColor;
        const skinColor = '#FFCCAA';

        ctx.fillStyle = skinColor;
        ctx.fillRect(-15, -10, 30, 20);

        ctx.fillStyle = capColor;
        ctx.beginPath();
        ctx.arc(15, 0, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = skinColor;
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(-5, -5);
        ctx.lineTo(-5 + Math.cos(armAngle)*20, -5 + Math.sin(armAngle)*20);
        ctx.stroke();

        ctx.restore();

        if (race.feedback.time > 0) {
            drawText(race.feedback.text, swimmerX, swimmerY - 40, 12, COLORS.white, 'center');
        }

        // Overlay
        drawRect(0, 0, CANVAS_WIDTH, 60, '#000000AA');
        drawText(`TIME: ${(race.timer/1000).toFixed(2)}`, 50, 40, 20, COLORS.white);
        drawText(`DIST: ${Math.min(100, race.distance).toFixed(1)}m`, 300, 40, 20, COLORS.white);
        drawText(`SPD: ${race.speed.toFixed(1)} m/s`, 600, 40, 16, COLORS.white);

        // Stamina
        const barW = 200;
        const barX = CANVAS_WIDTH/2 - barW/2;
        const barY = 550;
        drawRect(barX, barY, barW, 20, '#333', true);
        const stamPct = race.stamina / race.maxStamina;
        ctx.fillStyle = stamPct > 0.5 ? '#00FF00' : (stamPct > 0.2 ? '#FFFF00' : '#FF0000');
        ctx.fillRect(barX, barY, barW * stamPct, 20);
        drawText("STAMINA", barX, barY - 10, 12, COLORS.white);
    }

    // RESULTS SCREEN
    const resultsUI = {
        continueBtn: { x: 300, y: 500, w: 200, h: 50 }
    };

    function updateResults() {
        if (mouse.click) {
            if (isInside(mouse, resultsUI.continueBtn)) {
                // Advance 4 year cycle
                game.year += 4;
                game.month = 48;
                game.setHost();

                // Age up athletes
                game.playerNation.roster.forEach(a => a.ageUp());

                // Handle Retirement & HoF
                const retiring = game.playerNation.roster.filter(a => a.shouldRetire());
                retiring.forEach(a => {
                    if (a.hofTag) {
                        game.playerNation.hallOfFame.push(a);
                    }
                });

                // Remove retired
                game.playerNation.roster = game.playerNation.roster.filter(a => !a.shouldRetire());

                audio.playSfx('blip');
                currentState = GAME_STATES.HUB;
            }
        }
    }

    function drawResults() {
        const res = game.lastRaceResult;

        ctx.fillStyle = game.currentHost.primary;
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        drawRect(200, 100, 400, 400, COLORS.panelGray, true);

        ctx.fillStyle = game.currentHost.secondary;
        ctx.fillRect(204, 104, 392, 60);
        drawText("RESULTS", 400, 150, 24, COLORS.white, 'center');

        drawText(`RANK: ${res.rank}`, 400, 250, 30, COLORS.text, 'center');
        drawText(`TIME: ${res.time.toFixed(2)}s`, 400, 300, 20, COLORS.text, 'center');
        drawText(`PRIZE: $${res.prize}`, 400, 350, 20, '#00AA00', 'center');

        drawRect(resultsUI.continueBtn.x, resultsUI.continueBtn.y, resultsUI.continueBtn.w, resultsUI.continueBtn.h, COLORS.headerYellow, true);
        drawText("CONTINUE", 400, 535, 16, COLORS.text, 'center');
    }

    function update() {
        if (currentState === GAME_STATES.START) updateStart();
        if (currentState === GAME_STATES.HUB) updateHub();
        if (currentState === GAME_STATES.RACE) updateRace();
        if (currentState === GAME_STATES.RESULTS) updateResults();
        if (currentState === GAME_STATES.ROSTER) updateRoster();
        if (currentState === GAME_STATES.ATHLETE_DETAIL) updateDetail();
    }

    function draw() {
        ctx.fillStyle = COLORS.bgBlue;
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        if (currentState === GAME_STATES.START) drawStart();
        if (currentState === GAME_STATES.HUB) drawHub();
        if (currentState === GAME_STATES.RACE) drawRace();
        if (currentState === GAME_STATES.RESULTS) drawResults();
        if (currentState === GAME_STATES.ROSTER) drawRoster();
        if (currentState === GAME_STATES.ATHLETE_DETAIL) drawDetail();
    }

    function gameLoop() {
        update();
        draw();
        mouse.click = false;
        requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);

</script>
</body>
